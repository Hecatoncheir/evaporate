<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Evaporate">
  <title>Evaporate — иконка приложения, мелкие размеры</title>

  <!--
    Тот же знак для 32 точек и мельче: заголовок окна, трей, список задач.

    Отличий от старшего рисунка три, и каждое оплачено проверкой на ладдере:

    - нет ни свечения, ни искр, ни блика. Ореол подсвечивает плашку, и в 16
      точек контур буквы размывается ровно на ту величину, которой буква и
      нарисована;
    - градиент короче и весь высветленный: жёлтое — розовое — голубое. Полный
      спектр опускается в тёмно-фиолетовое, у которого контраст с чернильной
      плашкой меньше двух, и в мелком буква теряла нижнюю левую часть;
    - самый дальний блок убран. В 16 точках он занимал полпикселя и давал не
      распад, а грязь у края.
  -->

  <defs>
    <linearGradient id="liquid" gradientUnits="userSpaceOnUse" x1="300" y1="740" x2="760" y2="290">
      <stop offset="0" stop-color="#FFD227" />
      <stop offset="0.5" stop-color="#F5188C" />
      <stop offset="1" stop-color="#35D3F0" />
    </linearGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1B2130" />
      <stop offset="0.55" stop-color="#0C1116" />
      <stop offset="1" stop-color="#07090D" />
    </linearGradient>
  </defs>

  <rect x="80" y="80" width="864" height="864" rx="220" ry="220" fill="url(#body)" />

  <g fill="url(#liquid)">
    <rect x="300" y="300" width="84" height="420" />
    <rect x="384" y="636" width="306" height="84" />
    <rect x="384" y="468" width="216" height="84" />
    <rect x="384" y="300" width="118" height="84" />
    <rect x="530" y="306" width="80" height="72" />
    <rect x="638" y="312" width="50" height="60" />
  </g>

  <rect x="83" y="83" width="858" height="858" rx="217" ry="217"
        fill="none" stroke="#8FA2B8" stroke-opacity="0.28" stroke-width="6" />
</svg>
