<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Evaporate">
  <title>Evaporate — иконка приложения</title>

  <!--
    Знак — монограмма «E», у которой верхняя перекладина теряет вещество:
    блоки короче, ниже и дальше друг от друга, а за ними уходят искры. Имя
    приложения, сказанное самой буквой.

    Буква залита жидкой радугой: жёлтое внизу слева перетекает в розовое и
    дальше в холодный голубой вверху справа. Градиент задан в общих
    координатах (`gradientUnits="userSpaceOnUse"`), а не по каждой фигуре:
    иначе спектр повторялся бы в каждой перекладине отдельно и буква
    рассыпалась бы на полосатые куски.

    Тёмно-фиолетовый и индиго из исходной палитры сюда не взяты. На кремовой
    бумаге они держатся, на чернильной плашке их контраст падает ниже двух —
    в тех местах буква просто пропадала бы.

    Ширины и высоты у файла нет намеренно: так безголовый браузер рисует его
    в размер окна, и `tool/make_icon.py` получает каждый размер заново, а не
    уменьшением готового растра.

    Этот рисунок — для 48 точек и крупнее. Мельче берётся
    evaporate-icon-small.svg: там нет ни свечения, ни искр, и градиент короче.
  -->

  <defs>
    <linearGradient id="liquid" gradientUnits="userSpaceOnUse" x1="300" y1="740" x2="800" y2="270">
      <stop offset="0" stop-color="#FFD227" />
      <stop offset="0.22" stop-color="#F97A1F" />
      <stop offset="0.48" stop-color="#F5188C" />
      <stop offset="0.72" stop-color="#C238C8" />
      <stop offset="1" stop-color="#1FC5E8" />
    </linearGradient>

    <linearGradient id="body" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#20263A" />
      <stop offset="0.5" stop-color="#0E1319" />
      <stop offset="1" stop-color="#07090D" />
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8FA2B8" stop-opacity="0.8" />
      <stop offset="0.35" stop-color="#3A4658" stop-opacity="0.32" />
      <stop offset="1" stop-color="#8FA2B8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Разлив за буквой: тёплый снизу слева, холодный сверху справа. -->
    <radialGradient id="warm" cx="0.36" cy="0.66" r="0.5">
      <stop offset="0" stop-color="#F5188C" stop-opacity="0.34" />
      <stop offset="1" stop-color="#F5188C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolbg" cx="0.76" cy="0.3" r="0.36">
      <stop offset="0" stop-color="#1FC5E8" stop-opacity="0.26" />
      <stop offset="1" stop-color="#1FC5E8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.24" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="0.76" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="13" />
    </filter>
    <filter id="glowS" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <clipPath id="plate">
      <rect x="80" y="80" width="864" height="864" rx="220" ry="220" />
    </clipPath>
    <clipPath id="letter">
      <rect x="300" y="300" width="84" height="420" />
      <rect x="384" y="636" width="306" height="84" />
      <rect x="384" y="468" width="216" height="84" />
      <rect x="384" y="300" width="118" height="84" />
      <rect x="530" y="306" width="80" height="72" />
      <rect x="638" y="312" width="50" height="60" />
      <rect x="714" y="318" width="30" height="48" />
    </clipPath>
  </defs>

  <rect x="80" y="80" width="864" height="864" rx="220" ry="220" fill="url(#body)" />

  <g clip-path="url(#plate)">
    <rect x="80" y="80" width="864" height="864" fill="url(#warm)" />
    <rect x="80" y="80" width="864" height="864" fill="url(#coolbg)" />
    <rect x="80" y="80" width="864" height="864" fill="url(#sheen)" />

    <!-- Ореол буквы: размытая копия под ней, а не тень от края. -->
    <g filter="url(#glow)" opacity="0.5" fill="url(#liquid)">
      <rect x="300" y="300" width="84" height="420" />
      <rect x="384" y="636" width="306" height="84" />
      <rect x="384" y="468" width="216" height="84" />
      <rect x="384" y="300" width="118" height="84" />
      <rect x="530" y="306" width="80" height="72" />
      <rect x="638" y="312" width="50" height="60" />
      <rect x="714" y="318" width="30" height="48" />
    </g>

    <!-- След света за оторвавшимся веществом. -->
    <g filter="url(#glowS)" opacity="0.8">
      <path d="M762 336 C812 322 850 300 888 272" stroke="#1FC5E8" stroke-width="8"
            fill="none" stroke-linecap="round" opacity="0.7" />
    </g>

    <g fill="url(#liquid)">
      <rect x="300" y="300" width="84" height="420" />
      <rect x="384" y="636" width="306" height="84" />
      <rect x="384" y="468" width="216" height="84" />
      <rect x="384" y="300" width="118" height="84" />
      <rect x="530" y="306" width="80" height="72" />
      <rect x="638" y="312" width="50" height="60" />
      <rect x="714" y="318" width="30" height="48" />
    </g>

    <!-- Блик поперёк штриха, обрезан по букве, чтобы не светить мимо. -->
    <g clip-path="url(#letter)">
      <rect x="80" y="80" width="864" height="864" fill="url(#sweep)" opacity="0.42" />
    </g>

    <!-- Искры: сперва их свечение, потом они сами. -->
    <g filter="url(#glowS)" opacity="0.9">
      <path transform="translate(788 324) scale(22)" fill="#35D3F0"
            d="M0 -1 C0.12 -0.35 0.35 -0.12 1 0 C0.35 0.12 0.12 0.35 0 1 C-0.12 0.35 -0.35 0.12 -1 0 C-0.35 -0.12 -0.12 -0.35 0 -1 Z" />
      <path transform="translate(842 294) scale(14)" fill="#F5188C"
            d="M0 -1 C0.12 -0.35 0.35 -0.12 1 0 C0.35 0.12 0.12 0.35 0 1 C-0.12 0.35 -0.35 0.12 -1 0 C-0.35 -0.12 -0.12 -0.35 0 -1 Z" />
      <path transform="translate(882 268) scale(9)" fill="#FFD227"
            d="M0 -1 C0.12 -0.35 0.35 -0.12 1 0 C0.35 0.12 0.12 0.35 0 1 C-0.12 0.35 -0.35 0.12 -1 0 C-0.35 -0.12 -0.12 -0.35 0 -1 Z" />
      <circle cx="822" cy="356" r="7" fill="#9FD62E" />
      <circle cx="866" cy="322" r="5" fill="#35D3F0" />
    </g>
    <g>
      <path transform="translate(788 324) scale(22)" fill="#35D3F0"
            d="M0 -1 C0.12 -0.35 0.35 -0.12 1 0 C0.35 0.12 0.12 0.35 0 1 C-0.12 0.35 -0.35 0.12 -1 0 C-0.35 -0.12 -0.12 -0.35 0 -1 Z" />
      <path transform="translate(842 294) scale(14)" fill="#F5188C"
            d="M0 -1 C0.12 -0.35 0.35 -0.12 1 0 C0.35 0.12 0.12 0.35 0 1 C-0.12 0.35 -0.35 0.12 -1 0 C-0.35 -0.12 -0.12 -0.35 0 -1 Z" />
      <path transform="translate(882 268) scale(9)" fill="#FFD227"
            d="M0 -1 C0.12 -0.35 0.35 -0.12 1 0 C0.35 0.12 0.12 0.35 0 1 C-0.12 0.35 -0.35 0.12 -1 0 C-0.35 -0.12 -0.12 -0.35 0 -1 Z" />
      <circle cx="822" cy="356" r="7" fill="#9FD62E" opacity="0.85" />
      <circle cx="866" cy="322" r="5" fill="#35D3F0" opacity="0.9" />
    </g>
  </g>

  <rect x="83" y="83" width="858" height="858" rx="217" ry="217"
        fill="none" stroke="url(#rim)" stroke-width="6" />
</svg>
