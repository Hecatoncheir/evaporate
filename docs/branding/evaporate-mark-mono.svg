<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 420" fill="currentColor" role="img" aria-label="Evaporate">
  <title>Evaporate — знак, одноцветный</title>

  <!--
    Для мест, где цвет не наш: строка меню, печать, гравировка, чужая
    подложка. Цвет берётся у текста (`currentColor`), прозрачности нет
    намеренно — распад держится на убывающих размерах блоков, а не на
    бледности, которая в печати пропадает.
  -->

    <rect x="0" y="0" width="84" height="420" />
    <rect x="84" y="336" width="306" height="84" />
    <rect x="84" y="168" width="216" height="84" />
    <rect x="84" y="0" width="118" height="84" />
    <rect x="230" y="6" width="80" height="72" />
    <rect x="338" y="12" width="50" height="60" />
    <rect x="414" y="18" width="30" height="48" />
</svg>
