name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон — не жжём минуты
# macOS-раннеров на устаревшем коде.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия зафиксирована ради воспроизводимости. Чтобы всегда брать свежую
  # стабильную, замените на channel: stable без flutter-version.
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Анализатор
        run: flutter analyze

      # Тесты не требуют ни Xcode, ни aria2, ни геймпада: движок загрузок
      # не запускается, а события контроллера подаются вручную.
      # Иначе сверка разбора с настоящим выводом всегда пропускается.
      - name: Встроить Ludusavi
        run: python3 tool/fetch_ludusavi.py

      - name: Тесты
        run: flutter test --reporter compact

  build-macos:
    name: Сборка macOS
    runs-on: macos-latest
    needs: analyze
    # Только для тегов и ручного запуска: на пуше в main три сборки
    # выясняли бы то же, что и тесты, а macOS-раннер на приватном
    # репозитории считается с множителем десять.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Встроить Ludusavi
        run: python3 tool/fetch_ludusavi.py

      # Без сертификата разработчика Xcode подписывает бандл ad-hoc —
      # такой .app запускается локально, но Gatekeeper на чужой машине
      # потребует «Открыть всё равно».
      - name: Сборка
        run: flutter build macos --release

      # Вложенный файл ломает подпись, поэтому её накладывают заново.
      - name: Вложить Ludusavi в бандл
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo 'Собранный .app не найден'; exit 1; fi
          python3 tool/bundle_macos.py "$APP"

      - name: Упаковать бандл
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo 'Собранный .app не найден'; exit 1; fi
          echo "Упаковываю $APP"
          # ditto, а не zip: сохраняет симлинки и права внутри бандла.
          ditto -c -k --keepParent "$APP" \
            "evaporate-${GITHUB_REF_NAME#v}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: evaporate-macos-${{ github.sha }}
          path: evaporate-*-macos.zip
          retention-days: 14

  build-linux:
    name: Сборка Linux
    runs-on: ubuntu-latest
    needs: analyze
    # Только для тегов и ручного запуска: на пуше в main три сборки
    # выясняли бы то же, что и тесты, а macOS-раннер на приватном
    # репозитории считается с множителем десять.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Встроить Ludusavi
        run: python3 tool/fetch_ludusavi.py

      - name: Сборка
        run: flutter build linux --release

      # Архивом, а не папкой: к релизу прикладывают файл.
      - name: Упаковать сборку
        run: |
          tar -czf "evaporate-${GITHUB_REF_NAME#v}-linux.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: evaporate-linux-${{ github.sha }}
          path: evaporate-*-linux.tar.gz
          retention-days: 14

  build-windows:
    name: Сборка Windows
    runs-on: windows-latest
    needs: analyze
    # Только для тегов и ручного запуска: на пуше в main три сборки
    # выясняли бы то же, что и тесты, а macOS-раннер на приватном
    # репозитории считается с множителем десять.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Встроить Ludusavi
        run: python tool/fetch_ludusavi.py

      # Единственное место, где можно проверить работу с реестром: на
      # остальных системах этот тест пропускается.
      - name: Проверить автозапуск
        run: flutter test test/autostart_test.dart

      - name: Сборка
        run: flutter build windows --release

      # Compress-Archive, а не zip: его на раннере может не оказаться.
      - name: Упаковать сборку
        run: |
          $slug = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "evaporate-$slug-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: evaporate-windows-${{ github.sha }}
          path: evaporate-*-windows.zip
          retention-days: 14

  release:
    name: Приложить сборки к релизу
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    # Только для тегов: на обычных пушах прикладывать не к чему.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          ls -lh dist
          TAG="${GITHUB_REF_NAME}"
          # Тег могли отправить раньше, чем написано описание: тогда заводим
          # черновик, чтобы сборки не потерялись, а текст допишет человек.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft \
              --title "Evaporate ${TAG#v}" \
              --notes "Описание пока не написано."
          fi
          gh release upload "$TAG" dist/* --clobber
