name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон — не жжём минуты
# раннеров на устаревшем коде.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия зафиксирована ради воспроизводимости. Чтобы всегда брать свежую
  # стабильную, замените на channel: stable без flutter-version.
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze:
    name: Формат и анализ
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Версию считаем один раз здесь, а не в каждой сборке: она попадает в
      # имена файлов, в мастер установки и в пакет, и три отдельных способа
      # её вывести однажды дали бы три разных ответа.
      #
      # На теге версия — это тег. На ручном прогоне тега нет вовсе, а имя
      # ветки версией не притворяется: `evaporate-main-windows-setup.exe`
      # ещё куда ни шло, но Inno Setup на «main» в номере версии
      # останавливается с ошибкой.
      - name: Версия
        id: version
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            v[0-9]*) value="${GITHUB_REF_NAME#v}" ;;
            *) value=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml) ;;
          esac
          echo "Версия сборки: $value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Он же генерирует lib/l10n/app_localizations*.dart из .arb —
      # без этого шага не соберётся ничего, что импортирует локализацию.
      - run: flutter pub get

      - name: Форматирование
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Анализатор
        run: flutter analyze

      # Регистраторы плагинов генерирует `pub get`, а лежат они в
      # репозитории. Разойдясь, они молчат: файл прекрасно компилируется,
      # просто не регистрирует плагин, и возможность пропадает на той
      # платформе, где её забыли пересобрать. Так уже случилось с
      # desktop_drop: перетаскивание в окно на Linux и Windows не работало
      # от релиза к релизу, потому что сборка на это не жалуется.
      - name: Регистраторы плагинов пересобраны
        run: git diff --exit-code linux windows macos

  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Падение на одной системе не должно скрывать состояние остальных:
      # «сломалось везде» и «сломалось только на Windows» — разные диагнозы.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Три системы, а не одна: часть тестов пропускается по платформе, и на
      # ubuntu они не выполнялись вовсе — работа с реестром Windows молча
      # оставалась непроверенной. Тестам не нужны ни Xcode, ни сеть, ни
      # геймпад: движок загрузок не запускается, события контроллера
      # подаются вручную, поэтому прогон дешёвый на любой из систем.
      - name: Тесты
        if: matrix.os != 'ubuntu-latest'
        run: flutter test --reporter compact

      # Покрытие снимаем один раз — оно от системы не зависит, а lcov.info
      # нужен один. Заодно это единственный прогон, чей результат виден
      # числом, а не только зелёной галочкой.
      - name: Тесты с покрытием
        if: matrix.os == 'ubuntu-latest'
        run: flutter test --reporter compact --coverage

      - name: Порог покрытия без сгенерированного кода
        if: matrix.os == 'ubuntu-latest'
        run: dart tool/check_coverage.dart >> "$GITHUB_STEP_SUMMARY"

      - name: Приложить отчёт о покрытии
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 14

  build-macos:
    name: Сборка macOS
    runs-on: macos-latest
    needs: [analyze, test]
    # Только для тегов и ручного запуска: на пуше в main три сборки
    # выясняли бы то же, что и тесты, вчетверо дольше — сборка macOS
    # занимает минуты, а ответ «тесты прошли» нужен сразу.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Без сертификата разработчика Xcode подписывает бандл ad-hoc —
      # такой .app запускается локально, но Gatekeeper на чужой машине
      # потребует «Открыть всё равно».
      - name: Сборка
        run: flutter build macos --release

      # Двумя файлами, и оба нужны. Образ — то, что ставит человек: бандл
      # перетаскивают в «Программы» и на этом всё. Архив — то, что берёт
      # само приложение при обновлении: оно ищет в релизе файл с хвостом
      # `-macos.zip` и распаковывает его без участия Finder.
      - name: Упаковать бандл
        run: |
          set -eu
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo 'Собранный .app не найден'; exit 1; fi
          VERSION='${{ needs.analyze.outputs.version }}'
          echo "Упаковываю $APP"
          mkdir -p dist
          # ditto, а не zip: сохраняет симлинки и права внутри бандла.
          ditto -c -k --keepParent "$APP" "dist/evaporate-$VERSION-macos.zip"
          tool/package_macos.sh "$VERSION" "$APP" dist
          ls -lh dist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: evaporate-macos-${{ github.sha }}
          path: dist/evaporate-*
          retention-days: 14

  build-linux:
    name: Сборка Linux
    runs-on: ubuntu-latest
    needs: [analyze, test]
    # Только для тегов и ручного запуска — см. сборку macOS.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Сборка
        run: flutter build linux --release

      # Три файла, и каждый для своего. Пакет `.deb` — для Debian и Ubuntu:
      # ставится двойным щелчком, но ложится в /opt, куда без прав
      # администратора не записать, и обновлять его должен тот же, кто
      # ставил. `.run` — для всех остальных систем: кладёт приложение в
      # папку пользователя, поэтому обновление по нажатию там работает.
      # Архив — для самого приложения, когда оно обновляется.
      - name: Упаковать сборку
        run: |
          set -eu
          VERSION='${{ needs.analyze.outputs.version }}'
          mkdir -p dist
          tar -czf "dist/evaporate-$VERSION-linux.tar.gz" \
            -C build/linux/x64/release/bundle .
          tool/package_linux.sh "$VERSION" build/linux/x64/release/bundle dist
          tool/package_run.sh "$VERSION" build/linux/x64/release/bundle dist
          ls -lh dist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: evaporate-linux-${{ github.sha }}
          path: dist/evaporate-*
          retention-days: 14

  build-windows:
    name: Сборка Windows
    runs-on: windows-latest
    needs: [analyze, test]
    # Только для тегов и ручного запуска — см. сборку macOS.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Сборка
        run: flutter build windows --release

      # Ставим свой: на образе раннера Inno Setup может оказаться версии
      # старее той, чей синтаксис понимает windows/installer.iss.
      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      # Установщик — для человека, архив — для самообновления приложения:
      # оно ищет в релизе файл с хвостом `-windows.zip` и заменяет папку
      # само, мастер ему только помешал бы.
      - name: Упаковать сборку
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.analyze.outputs.version }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # Compress-Archive, а не zip: его на раннере может не оказаться.
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/evaporate-$version-windows.zip"

          $iscc = Get-ChildItem -Path `
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", `
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe не найден' }
          & $iscc.FullName "/DAppVersion=$version" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc вернул $LASTEXITCODE" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: evaporate-windows-${{ github.sha }}
          path: dist/evaporate-*
          retention-days: 14

  release:
    name: Выпустить релиз
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    # Только для тегов: на обычных пушах выпускать нечего.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Ради CHANGELOG.md и tool/changelog_notes.dart.
      - uses: actions/checkout@v7.0.1

      # Скрипту хватает голого dart: пакетов он не подключает, поэтому
      # `flutter pub get` здесь не нужен.
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@v8.0.1
        with:
          # Только сборки: отчёт о покрытии тоже артефакт прогона, и без
          # маски он уехал бы в релиз файлом, которого там никто не ждёт.
          pattern: evaporate-*
          path: dist
          merge-multiple: true

      - name: Выпустить
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ls -lh dist

          # Контрольные суммы кладём рядом с архивами. Приложение по ним
          # проверяет скачанное, прежде чем что-то с ним делать: канал
          # защищён TLS, но оборванная загрузка выглядит как целый файл, и
          # распаковывать её поверх установки нельзя.
          ( cd dist && sha256sum evaporate-*.* > SHA256SUMS )
          cat dist/SHA256SUMS

          # Описание релиза и запись в истории изменений — один и тот же
          # текст; писать его дважды значит однажды разойтись.
          if dart run tool/changelog_notes.dart "$VERSION" > notes.md; then
            DESCRIBED=1
          else
            # Раздела нет — выпускать молча нечего, но и сборки терять
            # нельзя: заводим черновик, текст допишет человек.
            DESCRIBED=0
            printf 'В CHANGELOG.md нет раздела для %s.\n\nОпишите версию и опубликуйте релиз вручную.\n' \
              "$VERSION" > notes.md
          fi

          # Заводим черновиком: сначала пусть приедут архивы, и только потом
          # релиз становится виден. Иначе подписчики получают письмо о
          # версии, скачать которую ещё нечего.
          #
          # Существующий в черновик не переводим — он мог быть уже
          # опубликован, и снимать его с публикации ради перезаписи описания
          # значит на время сломать ссылку, по которой уже ходят.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Evaporate $VERSION" \
              --notes-file notes.md
          else
            gh release create "$TAG" --draft --title "Evaporate $VERSION" \
              --notes-file notes.md
          fi

          gh release upload "$TAG" dist/* --clobber

          # Публикуем только черновик и только с описанием: опубликованное
          # трогать незачем, а без описания выпускать нечего.
          DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [ "$DESCRIBED" = 1 ] && [ "$DRAFT" = true ]; then
            gh release edit "$TAG" --draft=false
          fi

          if [ "$DESCRIBED" = 1 ]; then
            echo "Выпущен **Evaporate $VERSION**" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Релиз остался черновиком"
              echo ""
              echo "В CHANGELOG.md нет раздела для **$VERSION**:"
              echo "сборки приложены, описание за вами."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
