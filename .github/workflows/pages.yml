name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - design/prototype-v2/**
      - design/prototype-v3/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Экшены закреплены по коммиту, как в `ci.yml`: тег у стороннего экшена
# можно переставить, а этот поток выкладывает сайт с правом на запись.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Выкладка статики занимает минуту; зависший шаг не должен держать
    # раннер шесть часов по умолчанию.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare site and UI concepts
        run: |
          mkdir -p _pages/concept-v2 _pages/concept-v3/assets
          cp -R site/. _pages/
          cp design/prototype-v2/index.html _pages/concept-v2/
          cp design/prototype-v2/styles.css _pages/concept-v2/
          cp design/prototype-v2/app.js _pages/concept-v2/
          cp design/prototype-v3/index.html _pages/concept-v3/
          cp design/prototype-v3/styles.css _pages/concept-v3/
          cp design/prototype-v3/app.js _pages/concept-v3/
          cp design/prototype-v3/assets/orbit-fall-hero.png _pages/concept-v3/assets/
          sed -i 's#../../assets/fonts/#../assets/#g' _pages/concept-v2/styles.css
          sed -i 's#../../assets/branding/app_icon.png#../assets/app-icon.png#g' _pages/concept-v2/index.html
          sed -i 's#../../assets/fonts/#../assets/#g' _pages/concept-v3/styles.css
          sed -i 's#../../assets/branding/app_icon.png#../assets/app-icon.png#g' _pages/concept-v3/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
