name: evaporate
description: "Десктопный лончер игр: библиотека, загрузка по BitTorrent через SOCKS5 и сохранения, которые переносятся между устройствами."
# Приложение не публикуется на pub.dev.
publish_to: 'none'

# Нули здесь намеренно и означают «сборка не из релиза». Версию выпуска
# задаёт тег: CI передаёт её в `--build-name` и `--dart-define`, а держать её
# ещё и тут значило бы иметь два источника правды и однажды их развести.
version: 0.0.0+1

environment:
  sdk: ^3.13.2
  # Та же, что закреплена в CI (`env.FLUTTER_VERSION`). Без этой строки
  # сборка на старом Flutter падала бы разбором кода, а не понятным
  # «нужен Flutter новее».
  flutter: '>=3.47.0'

dependencies:
  archive: ^4.2.0
  # Bencode: движок его прячет, а приложению он нужен напрямую —
  # собрать .torrent из метаданных magnet-ссылки и посчитать infohash.
  b_encode_decode: ^1.0.5
  crypto: ^3.0.7
  desktop_drop: ^0.8.4
  # Форк с двумя правками. Первая: `progress` делил скачанное на ключ
  # `length`, а он есть только у однофайловой раздачи — у любой игры готовность
  # выходила нулевой, «завершено» не наступало никогда и запустить скачанное
  # было нечем. Вторая: один из зашитых корневых узлов
  # (`router.bittorrent.com`) разрешается в 0.0.0.0, отправка туда роняет
  # UDP-сокет, а следующая попытка возвращает порт уже закрытого — и DHT
  # выключается целиком, для любой раздачи. Обе правки предложены автору;
  # когда он их примет, здесь снова будет версия с pub.
  #
  # Первую приложение больше не спрашивает у движка вовсе — размер и
  # скачанное оно считает само, — но чужой `progress` читают и другие.
  #
  # Коммит закреплён намеренно: ветка может уехать, а сборка обязана
  # собираться той же. Тег переставить можно, коммит — нет, поэтому здесь
  # хеш, а тег форка (`v0.5.4-evaporate.1` — этот же коммит) — для людей:
  # по нему видно, какая это сборка форка, не читая историю.
  dtorrent_task_v2:
    git:
      url: https://github.com/Hecatoncheir/dtorrent_task_v2.git
      ref: 99da3b839af3ffed7d437580a42b52d60dc71377
  equatable: ^3.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  # Спайк «как есть»: зависимости прототипа evaporate_design.
  flutter_soloud: ^5.1.2
  flutter_svg: ^2.3.0
  gamepads: ^0.1.11
  google_fonts: ^8.2.1
  intl: ^0.20.3
  # Движок загрузок жалуется через `logging`, и его жалобы мы кладём в
  # журнал приложения: до сих пор задача могла часами висеть «активной», а
  # о недоступном трекере не было сказано ни слова.
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  socks5_proxy: ^2.1.1
  tray_manager: ^0.7.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  window_manager: ^0.5.2
  yaml: ^3.1.4

dev_dependencies:
  # Замер длины и сложности функций (`tool/check_complexity.dart`) читает
  # синтаксическое дерево, а не текст: разбор регулярками не видел
  # конструкторов, фабрик и `operator ==`. Пакет и прежде лежал в
  # pubspec.lock — его тянет `dart_style`, — и прямой зависимостью новых
  # пакетов он не принёс. В сборку приложения не входит.
  analyzer: ^14.0.0
  bloc_lint: ^0.4.2
  bloc_tools: 0.1.0-dev.24
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  # Значки Material лежат в сборке: ими подписаны все органы управления.
  uses-material-design: true

  # Строки интерфейса генерируются из lib/l10n/*.arb.
  generate: true

  assets:
    # Значок для трея грузится в рантайме, поэтому лежит в ассетах.
    - assets/branding/
    # Спайк «как есть»: значки и знак прототипа по тем же путям.
    - design/assets/icons/
    - design/assets/logo/

  # Шейдер компилируется при сборке, а не читается как обычный ассет: в
  # готовом приложении лежит уже машинный код для платформы.
  shaders:
    - assets/shaders/drops.frag
    - shaders/plume.frag
    - shaders/glass_lens.frag

  # Шрифты вариативные: один файл на всё семейство вместо десятка начертаний.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: Golos Text
      fonts:
        - asset: assets/fonts/GolosText.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
