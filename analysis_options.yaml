# Настройки анализатора. В CI подсказка (info) роняет прогон наравне с
# ошибкой, поэтому правила здесь — не пожелания, а ворота.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - windows/**
    - macos/**
    - linux/**

  # Неявный `dynamic` в приложении, которое читает чужой JSON, манифесты и
  # двоичный VDF, — это ошибка, отложенная до времени выполнения. Пусть
  # анализатор требует написать тип там, где сам его вывести не может.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Забытый `await` — здешняя болезнь. Обработчики блоков пишут на диск и
    # ходят в сеть, и брошенная задача не падает, а тихо не успевает: так
    # отложенная запись теряла последнее изменение при выходе.
    - unawaited_futures

    # Подписка и поток, которые некому закрыть, переживают свой блок.
    # Библиотека публикует два потока, сохранения держат две подписки на
    # них — и держат их ровно до `close()`.
    - cancel_subscriptions
    - close_sinks

    # Вызов по `dynamic` не проверяется вовсе. Разбор чужих форматов —
    # единственное место, где такое заводится само.
    - avoid_dynamic_calls

    # `const`-виджет Flutter не пересобирает. В оболочке, где кадры гонит
    # декоративный таймер, это не стилистика, а пропущенная работа.
    - prefer_const_constructors
    - prefer_const_declarations

    # Порядок импортов и зависимостей: их читают глазами, и предсказуемый
    # порядок дешевле любого соглашения, которое надо помнить.
    - directives_ordering
    - sort_pub_dependencies

    # Мелочи, которые стоят одной строки, а ловят молчаливые ошибки.
    - throw_in_finally
    - test_types_in_equals
    - avoid_type_to_string
    - prefer_final_locals

    # `catch` без `on` ловит и `Error` — ошибку программы, а не среды, — и
    # прячет её за сообщением «не вышло». Все обработчики уже пишут `on`;
    # правило держит это впредь.
    - avoid_catches_without_on_clauses

    # `async`-функция с `void` не даёт вызывающему дождаться её и поймать
    # её исключение: оно уходит в зону и пропадает.
    - avoid_void_async

    # Брошенная строка не отличима от ошибки и не несёт типа, по которому
    # её можно поймать `on`.
    - only_throw_errors

    # Одинарные кавычки — ещё и ради стража локализации: он ищет кириллицу
    # в литералах в одинарных кавычках, и строка в двойных проходила мимо.
    - prefer_single_quotes

    # Две строки подряд в списке без запятой молча склеиваются в одну.
    - no_adjacent_strings_in_list

    - prefer_const_literals_to_create_immutables

    # `setEnabled(true)` на месте вызова не говорит, что включается.
    - avoid_positional_boolean_parameters

# Правила bloc_lint. Их читает не анализатор, а `bloc lint .` из
# `bloc_tools` — отдельный шаг CI, потому что своего плагина у пакета нет.
#
# Список — не «рекомендованный набор», а то, что проект и правда держит:
#
# - `prefer_bloc` — это и есть записанное в CLAUDE.md «по умолчанию Bloc»,
#   поставленное на ворота. Cubit в приложении не осталось, и правило
#   стережёт, чтобы новый не завёлся молча;
# - `avoid_flutter_imports` — блок без `BuildContext` и виджетов. Одно
#   исключение помечено в коде: движок загрузок отдаёт `ValueListenable`,
#   и подписаться на него нечем, кроме `foundation`;
# - `avoid_public_bloc_methods` — с блоком говорят событиями. Восемь мест
#   помечены `// ignore:` каждое со своим объяснением рядом: поток наружу,
#   хук «снять сейв перед запуском», ожидание первого чтения настроек —
#   это не «метод вместо события», а то, чего событием не выразить;
# - `prefer_file_naming_conventions` и `prefer_void_public_cubit_methods`
#   — даром: нарушений нет ни одного.
#
# `avoid_public_fields` не включён намеренно. Он про то, что данные блока
# живут в состоянии, а срабатывает на двадцати двух внедрённых
# зависимостях (`settings`, `library`, `engine`, `notifications`, `paths`)
# — их публичность и есть способ подменить их в прогоне, а в состояние им
# нельзя.
bloc:
  rules:
    - avoid_flutter_imports
    - avoid_public_bloc_methods
    - prefer_bloc
    - prefer_file_naming_conventions
    - prefer_void_public_cubit_methods
